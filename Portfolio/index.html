<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    main {
      width: min(520px, calc(100% - 40px));
      padding: 48px 32px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 32px;
      color: #1f2937;
    }

    .button {
      display: block;
      margin: 16px 0;
      padding: 18px 20px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <main>
    <h1>Portfolio</h1>

    <a class="button" href="category-analysis.pdf" target="_blank">
      Category analysis
    </a>

    <a class="button" href="Project_PowerBI.pptx" target="_blank">
      Power BI
    </a>
  </main>
</body>
</html>
